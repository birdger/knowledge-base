<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="400" viewBox="0 0 1600 400" font-family="'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="400" fill="url(#bg)"/>
  <circle cx="1380" cy="60" r="220" fill="url(#glow)"/>
  <circle cx="220" cy="380" r="180" fill="url(#glow)"/>
  <g opacity="0.16" stroke="#94a3b8" stroke-width="1">
    <path d="M0 80 H1600 M0 160 H1600 M0 240 H1600 M0 320 H1600" stroke-dasharray="2 14"/>
  </g>

  <!-- logo -->
  <g transform="translate(120,86)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#accent)"/>
    <path d="M20 20 h24 a8 8 0 0 1 8 8 v20 a4 4 0 0 1 -4 4 h-20 l-8 8 z" fill="#0f172a"/>
    <circle cx="30" cy="36" r="3" fill="#a5b4fc"/>
    <circle cx="40" cy="36" r="3" fill="#a5b4fc"/>
  </g>

  <text x="220" y="122" fill="#f8fafc" font-size="52" font-weight="700">Enterprise Knowledge Base</text>
  <text x="222" y="170" fill="#a5b4fc" font-size="26" font-weight="600">企业级智能知识库平台 · Spring Cloud 微服务 × RAG 问答 × 知识图谱</text>
  <text x="222" y="212" fill="#94a3b8" font-size="20">文档协作 · 全文/语义双检索 · AI 写作助手 · Neo4j 图谱 · 细粒度权限与团队空间</text>

  <!-- stat chips -->
  <g font-size="18" font-weight="600">
    <g transform="translate(222,248)">
      <rect width="150" height="42" rx="21" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="27" fill="#e2e8f0">9 微服务</text>
    </g>
    <g transform="translate(388,248)">
      <rect width="150" height="42" rx="21" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="27" fill="#e2e8f0">333 接口</text>
    </g>
    <g transform="translate(554,248)">
      <rect width="170" height="42" rx="21" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="27" fill="#e2e8f0">10 库 51 表</text>
    </g>
    <g transform="translate(740,248)">
      <rect width="190" height="42" rx="21" fill="#1e293b" stroke="#475569"/>
      <text x="20" y="27" fill="#e2e8f0">28 前端页面</text>
    </g>
  </g>

  <!-- pipeline -->
  <g transform="translate(222,320)" font-size="16" font-weight="600">
    <g>
      <rect width="150" height="40" rx="10" fill="#312e81" stroke="#6366f1"/>
      <text x="30" y="26" fill="#c7d2fe">📝 文档中心</text>
    </g>
    <path d="M158 20 h26 m-8 -7 l8 7 l-8 7" stroke="#64748b" stroke-width="2" fill="none"/>
    <g transform="translate(192,0)">
      <rect width="170" height="40" rx="10" fill="#312e81" stroke="#6366f1"/>
      <text x="28" y="26" fill="#c7d2fe">🔎 双模检索</text>
    </g>
    <path d="M370 20 h26 m-8 -7 l8 7 l-8 7" stroke="#64748b" stroke-width="2" fill="none"/>
    <g transform="translate(404,0)">
      <rect width="190" height="40" rx="10" fill="#312e81" stroke="#8b5cf6"/>
      <text x="34" y="26" fill="#ddd6fe">🤖 RAG 问答</text>
    </g>
    <path d="M602 20 h26 m-8 -7 l8 7 l-8 7" stroke="#64748b" stroke-width="2" fill="none"/>
    <g transform="translate(636,0)">
      <rect width="190" height="40" rx="10" fill="#312e81" stroke="#8b5cf6"/>
      <text x="34" y="26" fill="#ddd6fe">✍️ AI 写作</text>
    </g>
    <path d="M834 20 h26 m-8 -7 l8 7 l-8 7" stroke="#64748b" stroke-width="2" fill="none"/>
    <g transform="translate(868,0)">
      <rect width="190" height="40" rx="10" fill="#134e4a" stroke="#34d399"/>
      <text x="34" y="26" fill="#a7f3d0">🕸️ 知识图谱</text>
    </g>
  </g>
</svg>
